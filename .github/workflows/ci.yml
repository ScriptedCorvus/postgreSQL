name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore DatabaseClient.slnx

    - name: Build (Release)
      run: dotnet build DatabaseClient.slnx --configuration Release --no-restore -warnaserror-

    - name: Run tests with coverage
      run: |
        dotnet test DatabaseClient.slnx --configuration Release --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults/**/*.trx

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: ./TestResults/**/coverage.cobertura.xml

    - name: Check code formatting
      run: dotnet format DatabaseClient.slnx --verify-no-changes --severity warn
      continue-on-error: true
